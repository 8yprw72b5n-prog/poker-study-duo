<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<title>Poker Study Duo</title>
<style>
:root{--bg:#f5f1e8;--ink:#18201b;--green:#0b6b43;--green2:#0e8050;--card:#fffdf8;--muted:#68736d;--line:#ddd7ca;--good:#dff3e8;--warn:#fff1cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",Arial,sans-serif}
.app{max-width:900px;margin:auto;min-height:100vh}.top{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:21px}.level{background:#e5efe9;color:var(--green);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}
main{padding:0 14px 30px}.hero{background:linear-gradient(145deg,#0b6b43,#084b31);color:white;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 10px 30px #0b4b3020}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#dcefe6;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff16;border:1px solid #ffffff20;border-radius:16px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#cde5d9}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}.panel h2{font-size:18px;margin:0 0 14px}.lesson{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;margin:9px 0;background:#fff}
.icon{width:40px;height:40px;border-radius:12px;background:#e5f2eb;display:grid;place-items:center;color:var(--green);font-weight:800}.lesson strong{display:block}.lesson small{color:var(--muted);line-height:1.4}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:15px;background:var(--green);color:white;cursor:pointer}.btn.secondary{background:#e9eee9;color:var(--green)}.btn:active{transform:translateY(1px)}
.cardrow{display:flex;gap:10px;flex-wrap:wrap}.playing{width:70px;height:96px;border-radius:12px;background:white;border:1px solid #cfc8ba;box-shadow:0 5px 12px #00000012;display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-weight:800;font-size:20px}.red{color:#c43d3d}.black{color:#1d2721}
.question{font-size:20px;font-weight:800;line-height:1.4}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.choice{padding:15px;border:1px solid var(--line);border-radius:14px;background:white;text-align:left;font-weight:700;cursor:pointer}.choice.correct{background:var(--good);border-color:#8bc9a6}.choice.wrong{background:#fde7e7;border-color:#e5a3a3}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f3f6f2;line-height:1.55}.progress{height:8px;background:#e4e1d8;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--green);width:0;transition:.25s}.hidden{display:none!important}
.footer{padding:10px 18px 28px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
@media(max-width:560px){.hero h1{font-size:24px}.stats{grid-template-columns:1fr 1fr 1fr}.playing{width:62px;height:88px}.choices{grid-template-columns:1fr}.top{padding-top:16px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Poker Study Duo</div><div class="level" id="level">Lv. 1 · Beginner</div></header>
<main>
<section class="hero">
<h1>포커를 '플레이'하기보다 먼저 이해하세요.</h1>
<p>카드 조합, 확률, 포지션, 팟 오즈 같은 핵심 개념을 짧은 문제로 학습하고 즉시 해설을 확인합니다.</p>
<div class="stats">
<div class="stat"><b id="xp">0</b><span>XP</span></div>
<div class="stat"><b id="streak">1</b><span>학습 연속일</span></div>
<div class="stat"><b id="accuracy">0%</b><span>정답률</span></div>
</div>
</section>

<section class="panel">
<h2>오늘의 학습</h2>
<div class="lesson"><div class="icon">1</div><div><strong>핸드 랭킹</strong><small>가장 강한 5장 조합을 구분하는 법</small></div><button class="btn" style="margin-left:auto" onclick="startLesson('ranking')">시작</button></div>
<div class="lesson"><div class="icon">2</div><div><strong>확률 기초</strong><small>아웃과 확률을 직관적으로 이해하기</small></div><button class="btn" style="margin-left:auto" onclick="startLesson('odds')">시작</button></div>
<div class="lesson"><div class="icon">3</div><div><strong>포지션</strong><small>행동 순서가 판단에 미치는 영향</small></div><button class="btn" style="margin-left:auto" onclick="startLesson('position')">시작</button></div>
</section>

<section class="panel hidden" id="quiz">
<h2 id="quizTitle">학습</h2>
<div class="progress"><div id="bar"></div></div>
<div id="cards" class="cardrow"></div>
<p class="question" id="question"></p>
<div class="choices" id="choices"></div>
<div class="feedback hidden" id="feedback"></div>
<button class="btn hidden" id="next" onclick="nextQuestion()" style="margin-top:12px">다음 문제</button>
</section>
</main>
<div class="footer">교육용 프로토타입 · 금전 거래나 베팅 기능 없음</div>
</div>
<script>
const BANK={
ranking:[
 {cards:[['A','♠'],['A','♥'],['7','♣'],['7','♦'],['2','♠']],q:'이 보드의 가장 중요한 조합은 무엇인가요?',a:'Two Pair',opts:['One Pair','Two Pair','Three of a Kind','Straight'],e:'A 한 쌍과 7 한 쌍이 있으므로 Two Pair입니다.'},
 {cards:[['9','♠'],['8','♠'],['7','♠'],['6','♠'],['5','♠']],q:'이 다섯 장이 모두 같은 무늬이고 연속되어 있다면?',a:'Straight Flush',opts:['Flush','Straight','Straight Flush','Full House'],e:'같은 무늬 + 연속된 숫자의 조합은 Straight Flush입니다.'},
 {cards:[['K','♠'],['K','♥'],['K','♦'],['2','♣'],['9','♠']],q:'현재 가장 높은 조합은?',a:'Three of a Kind',opts:['One Pair','Two Pair','Three of a Kind','Full House'],e:'K가 세 장이므로 Three of a Kind입니다.'}
],
odds:[
 {cards:[['A','♠'],['K','♠'],['7','♦'],['2','♣'],['9','♥']],q:'덱의 정확한 구성과 필요한 카드 수를 알면 무엇을 계산할 수 있나요?',a:'Outs 기반 확률',opts:['Outs 기반 확률','상대의 실제 생각','다음 카드 확정','승리 보장'],e:'남은 덱에서 도움이 되는 카드 수(outs)를 세면 확률을 계산할 수 있습니다.'},
 {cards:[['Q','♠'],['J','♠'],['10','♦'],['3','♣'],['2','♥']],q:'확률을 공부할 때 가장 먼저 확인할 것은?',a:'현재 정보와 남은 가능성',opts:['상대의 표정','현재 정보와 남은 가능성','무조건 베팅','결과'],e:'확률 판단은 현재 알고 있는 정보와 가능한 결과의 공간에서 시작합니다.'}
],
position:[
 {cards:[['A','♠'],['Q','♥'],['7','♣'],['4','♦'],['2','♠']],q:'일반적으로 행동 순서가 늦으면 얻는 정보는?',a:'앞선 행동 정보',opts:['항상 승리','앞선 행동 정보','카드 한 장 추가','상대 카드 공개'],e:'뒤에서 행동하면 앞선 플레이어들의 행동을 관찰한 뒤 결정할 수 있습니다.'},
 {cards:[['8','♠'],['8','♥'],['K','♣'],['5','♦'],['2','♣']],q:'포지션을 공부하는 핵심 이유는?',a:'정보와 행동 순서의 차이',opts:['카드의 무늬 변경','정보와 행동 순서의 차이','덱 크기 변경','팟 자동 증가'],e:'포지션은 내가 언제 행동하는지와 그 전에 얻는 정보의 양에 영향을 줍니다.'}
]
};

let lesson=[],idx=0,score=0,answered=false;
let stats=JSON.parse(localStorage.getItem('psd_stats')||'{"xp":0,"correct":0,"total":0,"streak":1}');
function save(){localStorage.setItem('psd_stats',JSON.stringify(stats));updateStats()}
function updateStats(){document.getElementById('xp').textContent=stats.xp;document.getElementById('streak').textContent=stats.streak;document.getElementById('accuracy').textContent=(stats.total?Math.round(stats.correct/stats.total*100):0)+'%';let lv=Math.floor(stats.xp/100)+1;document.getElementById('level').textContent=`Lv. ${lv} · ${lv<3?'Beginner':lv<5?'Learner':'Advanced'}`}
function startLesson(type){lesson=BANK[type].slice();idx=0;score=0;document.getElementById('quiz').classList.remove('hidden');document.getElementById('quiz').scrollIntoView({behavior:'smooth'});renderQ()}
function renderQ(){answered=false;const x=lesson[idx];document.getElementById('quizTitle').textContent=`학습 ${idx+1}/${lesson.length}`;document.getElementById('bar').style.width=((idx)/lesson.length*100)+'%';document.getElementById('question').textContent=x.q;document.getElementById('feedback').classList.add('hidden');document.getElementById('next').classList.add('hidden');const c=document.getElementById('cards');c.innerHTML=x.cards.map(([r,s])=>`<div class="playing ${['♥','♦'].includes(s)?'red':'black'}"><span>${r}</span><span>${s}</span></div>`).join('');const ch=document.getElementById('choices');ch.innerHTML=x.opts.map(o=>`<button class="choice" onclick="answer(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
function answer(el,val){if(answered)return;answered=true;const x=lesson[idx];const ok=val===x.a;stats.total++;if(ok){stats.correct++;stats.xp+=20;score++}else stats.xp+=5;save();document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct')});if(!ok)el.classList.add('wrong');const f=document.getElementById('feedback');f.classList.remove('hidden');f.innerHTML=`<strong>${ok?'정답입니다.':'다시 생각해 보세요.'}</strong><br>${x.e}`;document.getElementById('next').classList.remove('hidden')}
function nextQuestion(){idx++;if(idx>=lesson.length){document.getElementById('question').textContent=`완료! ${score}/${lesson.length} 정답`;document.getElementById('cards').innerHTML='';document.getElementById('choices').innerHTML='';document.getElementById('feedback').classList.remove('hidden');document.getElementById('feedback').innerHTML=`이번 학습에서 ${score*20+(lesson.length-score)*5} XP를 획득했습니다.`;document.getElementById('next').classList.add('hidden');document.getElementById('bar').style.width='100%';return}renderQ()}
updateStats();
</script>
</body>
</html>
